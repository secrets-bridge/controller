# permissions to do leader election.
# controller-runtime defaults to a Lease lock, and client-go's LeaseLock
# only calls Get, Create and Update. ConfigMaps are not used (CTL-N-02).
# Events: the leader election recorder posts core/v1 events.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: secrets-bridge
    app.kubernetes.io/managed-by: kustomize
  name: leader-election-role
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
