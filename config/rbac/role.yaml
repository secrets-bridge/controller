---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - sync.secrets-bridge.io
  resources:
  - secretssyncs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sync.secrets-bridge.io
  resources:
  - secretssyncs/status
  verbs:
  - patch
  - update
